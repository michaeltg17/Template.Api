name: ci

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          push: false
          load: true
          tags: template-api-ci:latest
          cache-from: type=gha,scope=template-api-ci
          cache-to: type=gha,mode=max,scope=template-api-ci

      - name: Run CI checks
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock template-api-ci:latest

      - name: Validate Docker image builds
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=template-api-production
          cache-to: type=gha,mode=max,scope=template-api-production

      - name: Validate migrations Docker image builds
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.migrations
          push: false
          cache-from: type=gha,scope=template-db-migrations-production
          cache-to: type=gha,mode=max,scope=template-db-migrations-production

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Metadata for Docker image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/template-api
          tags: |
            type=sha,prefix=,length=7
            type=raw,value=latest

      - name: Metadata for migrations Docker image
        id: meta-migrations
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/template-db-migrations
          tags: |
            type=sha,prefix=,length=7
            type=raw,value=latest

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=template-api-production
          cache-to: type=gha,mode=max,scope=template-api-production

      - name: Build and push migrations Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.migrations
          push: true
          tags: ${{ steps.meta-migrations.outputs.tags }}
          labels: ${{ steps.meta-migrations.outputs.labels }}
          cache-from: type=gha,scope=template-db-migrations-production
          cache-to: type=gha,mode=max,scope=template-db-migrations-production

      - name: Extract PR number from merge commit
        id: extract-pr
        run: |
          MERGE_MSG=$(git log -1 --format=%B)
          PR_NUMBER=$(echo "$MERGE_MSG" | grep -oP '#\K[0-9]+' | head -1)
          echo "PR number: $PR_NUMBER"
          if [ -z "$PR_NUMBER" ]; then
            echo "::warning::No PR number found in merge commit message: $MERGE_MSG"
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Fetch PR title and notes
        id: pr-notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::group::Fetching PR #${{ steps.extract-pr.outputs.pr_number }}"
          PR_JSON=$(gh pr view ${{ steps.extract-pr.outputs.pr_number }} --json title,body)
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
          PR_BODY=$(echo "$PR_JSON" | jq -r '.body')
          echo "::endgroup::"
          echo "PR title: $PR_TITLE"
          echo "pr_title=$PR_TITLE" >> $GITHUB_OUTPUT
          echo "$PR_BODY" > release-notes.txt
          cat release-notes.txt

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(echo "${{ steps.meta.outputs.tag-names }}" | grep -E '^[0-9a-f]{7}$')
          gh release create "$SHORT_SHA" \
            --target ${{ github.sha }} \
            --title "${{ steps.pr-notes.outputs.pr_title }}" \
            --notes-file release-notes.txt \
            --latest
